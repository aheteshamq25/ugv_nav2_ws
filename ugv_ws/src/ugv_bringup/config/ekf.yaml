# Optional robot_localization EKF to fuse wheel odometry + IMU into a smoother
# /odom before it reaches AMCL/Nav2. Wire in via robot_localization's
# ekf_node if your real UGV's raw wheel odometry is noisy.
ekf_filter_node:
  ros__parameters:
    frequency: 30.0
    two_d_mode: true
    publish_tf: true
    odom_frame: odom
    base_link_frame: base_footprint
    world_frame: odom

    odom0: /odom
    odom0_config: [true,  true,  false,
                    false, false, true,
                    true,  true,  false,
                    false, false, true,
                    false, false, false]
    odom0_differential: false

    imu0: /imu
    imu0_config: [false, false, false,
                   true,  true,  true,
                   false, false, false,
                   true,  true,  true,
                   true,  true,  true]
    imu0_differential: false
    imu0_remove_gravitational_acceleration: true
